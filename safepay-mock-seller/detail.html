<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Detail | Ecommerce</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f9f9f9;
            padding: 0;
        }

        .navbar {
            background: #333;
            color: white;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 1rem;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: #fff;
            border-radius: 12px;
            padding: 30px;
            margin-top: 30px;
            margin-bottom: 50px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        .product-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 30px;
            color: #333;
        }

        .product-detail {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }

        .image-slider {
            flex: 1 1 400px;
            position: relative;
        }

        .image-slider img {
            width: 100%;
            border-radius: 12px;
            height: 350px;
            object-fit: cover;
        }

        .slider-buttons {
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
        }

        .slider-buttons button {
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            border: none;
            padding: 8px 12px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 6px;
        }

        .product-info {
            flex: 1 1 400px;
        }

        .product-info .price {
            font-size: 1.5rem;
            color: #28a745;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .product-info .description {
            font-size: 1rem;
            color: #444;
            margin-bottom: 30px;
        }

        .buy-btn {
            background-color: #007bff;
            color: white;
            padding: 14px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .buy-btn:hover {
            background-color: #0056b3;
        }

        .suggested {
            margin-top: 50px;
        }

        .suggested h3 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .suggested-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .suggested-list a {
            background: #f3f3f3;
            padding: 15px;
            border-radius: 10px;
            text-decoration: none;
            color: inherit;
            transition: 0.3s ease;
        }

        .suggested-list a:hover {
            background: #e9ecef;
        }

        .suggested-list img {
            width: 100%;
            border-radius: 10px;
            height: 150px;
            object-fit: cover;
            margin-bottom: 10px;
        }

        .suggested-list h4 {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .suggested-list .price {
            font-size: 0.95rem;
            color: #28a745;
        }

        @media (max-width: 768px) {
            .product-detail {
                flex-direction: column;
            }

            .image-slider img {
                height: 250px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div>🛍 Ecommerce</div>
        <a href="index.html">← Back to Products</a>
    </div>

    <div class="container">
        <div class="product-detail">
            <div class="image-slider">
                <img id="sliderImage" src="" alt="Product Image" />
                <div class="slider-buttons">
                    <button onclick="prevImage()">&#8592;</button>
                    <button onclick="nextImage()">&#8594;</button>
                </div>
            </div>

            <div class="product-info">
                <div class="product-title" id="productName">Loading...</div>
                <div class="price" id="productPrice">₹0</div>
                <div class="description" id="productDesc">Loading description...</div>
                <button class="buy-btn" onclick="goToCheckout()">Buy Now with SafePay</button>
            </div>
        </div>

        <div class="suggested">
            <h3>Suggested Products</h3>
            <div class="suggested-list" id="suggestedList"></div>
        </div>
    </div>

    <script>
        let products = null;
        let selectedProduct = null;
        let imageIndex = 0;

        fetch('products.json')
            .then(response => response.json())
            .then(data => {
                products = data;
                showDetail();
            });

        function showDetail() {
            const params = new URLSearchParams(window.location.search);
            const productId = params.get("id");
            const product = products.find(p => p.id == productId);

            if (!product) {
                alert("Product not found");
                window.location.href = "/";
                return;
            }

            selectedProduct = product;
            imageIndex = 0;

            document.getElementById('sliderImage').src = product.images[imageIndex];
            document.getElementById('productName').innerText = product.name;
            document.getElementById('productPrice').innerText = "₹" + product.price;
            document.getElementById('productDesc').innerText = product.description;

            // Suggested products
            const suggested = products.filter(p => p.id != product.id).slice(0, 4); // top 4 others
            const container = document.getElementById('suggestedList');

            suggested.forEach(prod => {
                const card = document.createElement('a');
                card.href = `detail.html?id=${prod.id}`;
                card.innerHTML = `
          <img src="${prod.images[0]}" alt="${prod.name}">
          <h4>${prod.name}</h4>
          <div class="price">₹${prod.price}</div>
        `;
                container.appendChild(card);
            });
        }

        function nextImage() {
            if (selectedProduct && selectedProduct.images.length > 0) {
                imageIndex = (imageIndex + 1) % selectedProduct.images.length;
                document.getElementById('sliderImage').src = selectedProduct.images[imageIndex];
            }
        }

        function prevImage() {
            if (selectedProduct && selectedProduct.images.length > 0) {
                imageIndex = (imageIndex - 1 + selectedProduct.images.length) % selectedProduct.images.length;
                document.getElementById('sliderImage').src = selectedProduct.images[imageIndex];
            }
        }

        function goToCheckout() {
            const query = new URLSearchParams({
                name: selectedProduct.name,
                description: selectedProduct.description,
                price: selectedProduct.price,
                images: JSON.stringify(selectedProduct.images) // ✅ send as stringified array
            }).toString();

            window.location.href = `checkout.html?${query}`;
        }
    </script>
</body>

</html>
